[project]
name = "vdiup-argo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cartopy",
    "cmocean",
    "earthaccess",
    "geopandas",
    "kaleido",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pandas",
    "plotly~=6.9",  # PyCharm 2026.2.3 is not yet compatible with plotly >=7.0.0, so we pin to 6.9 for now
    "pysolar",
    "scipy",
    "statsmodels",
    "xarray",
]

[project.optional-dependencies]
obsolete = [
    "pvlib",
    "seawater",
]
